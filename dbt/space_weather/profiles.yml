space_weather:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DWH_HOST', 'postgres') }}"
      port: "{{ env_var('DWH_PORT', '5432') | int }}"
      user: "{{ env_var('DWH_USER', 'dwh_admin') }}"
      password: "{{ env_var('DWH_PASSWORD', 'SpaceWeather_2026!') }}"
      dbname: "{{ env_var('DWH_DB', 'space_weather_dwh') }}"
      schema: gold
      threads: 4
